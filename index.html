<style>

.bd{display:inline-flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:5px 8px;margin:3px 3px 0 0;font-size:13px}.bd.lk{opacity:.4;filter:grayscale(1)}
.ch{background:linear-gradient(100deg,#e4572e33,#2a7fff33);border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}

#stage{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 12% 18%,#e4572e66,transparent 38%),radial-gradient(circle at 90% 28%,#2a7fff66,transparent 40%),radial-gradient(circle at 28% 94%,#8e44ad66,transparent 42%),radial-gradient(circle at 86% 92%,#ffd23f55,transparent 36%),var(--bg);display:flex;align-items:center;justify-content:center;padding:8px}
svg#cv{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}

.tb i{font-style:normal;font-size:19px;line-height:1.1;color:var(--ink)}
.tb.on{background:var(--acc);border-color:var(--acc);color:var(--accI)}.tb.on i{color:var(--accI)}

#pal{display:flex;gap:2px;flex:0 0 auto}

#cc{width:30px;height:28px;padding:0;border:1px solid var(--line);background:none;flex:0 0 auto}
#lesson{background:var(--panel);border-top:2px solid var(--acc);max-height:36vh;overflow:auto;padding:9px 12px}
#lesson.off{display:none}
#lesson h2{margin:0 0 4px;font-size:16px}
.why{background:var(--sel);border-radius:8px;padding:6px 9px;margin:4px 0 6px;font-size:14px}
ol.st{list-style:none;margin:6px 0;padding:0}
ol.st li{display:flex;gap:8px;padding:5px 4px;border-top:1px solid var(--line);font-size:14px}
.ck{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
li.ok .ck{background:var(--acc);border-color:var(--acc);color:var(--accI)}
li.ok .t{color:var(--mut);text-decoration:line-through}
li.cur{background:var(--sel);border-radius:8px}
.go{background:var(--acc);color:var(--accI);border:0;border-radius:10px;padding:9px 14px;font-weight:600}
#menu{position:fixed;inset:0;background:#000a;display:none;z-index:20}
#menu.open{display:block}
#mlist{position:absolute;left:0;top:0;bottom:0;width:min(86vw,340px);background:var(--panel);padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow:auto}

#mlist .cur{border-color:var(--acc);background:var(--sel)}
.n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px}
.d .n{background:var(--acc);color:var(--accI)}

#lesson{grid-row:1/9;grid-column:1;max-height:none;border-top:0;border-right:2px solid var(--acc)}
#lesson.off{display:block}#stage,#st,#tgrp,#tools,#pw,#tabs,#props,#xpan{grid-column:2}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}

#coach{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:40;background:var(--panel);border:2px solid var(--acc);border-radius:14px;padding:8px 10px;box-shadow:0 6px 22px #0007;display:none;max-width:560px;margin:0 auto}

['tri','▲',['Треугольник','Uchburchak'],['«Треугольник»: проведите по диагонали. Основа крыш, гор, стрелок и пирамид.','«Uchburchak»: diagonal bo‘ylab suring. Tom, tog‘, strelka va piramida asosi.']],
['arrow','➜',['Стрелка','Strelka'],['«Стрелка»: проведите по диагонали. Для схем, указателей и инструкций.','«Strelka»: diagonal bo‘ylab suring. Sxema, ko‘rsatkich va yo‘riqnomalar uchun.']],
['heart','♥',['Сердце','Yurak'],['«Сердце»: проведите по диагонали. Для открыток, значков и логотипов.','«Yurak»: diagonal bo‘ylab suring. Otkritka, belgi va logotiplar uchun.']],
['spi','🌀',['Спираль','Spiral'],['«Спираль»: проведите по диагонали — получится завиток. Для узоров и декоративных эффектов.','«Spiral»: diagonal bo‘ylab suring — o‘ram hosil bo‘ladi. Naqsh va bezaklar uchun.']],
['bez','✒',['Перо','Qalam'],['«Перо» (кривая Безье): касание — острый угол, касание с протяжкой — плавный изгиб. Двойное касание завершает линию.','«Qalam» (Bezye egri chizig‘i): tegish — o‘tkir burchak, tortib tegish — silliq egrilik. Ikki marta tegish chiziqni tugatadi.']],
['lasso','◌',['Лассо','Lasso'],['«Лассо» (Freehand Pick): обведите пальцем группу объектов — все, чей центр внутри обводки, выделятся. Дальше их можно сдвинуть, сгруппировать, выровнять. Нужен, когда объектов много.','«Lasso» (Freehand Pick): barmoq bilan bir guruh obyektni aylantirib chizing — markazi ichkarida qolganlari tanlanadi. Keyin ularni surish, guruhlash, tekislash mumkin. Obyektlar ko‘p bo‘lganda kerak.']],
['knife','🔪',['Нож','Pichoq'],['«Нож» (Knife): проведите линию через фигуру — она разрежется на части, которые можно двигать отдельно. Так делают разрезы, полоски и «разбитые» буквы. Нужен интернет.','«Pichoq» (Knife): shakl orqali chiziq torting — u qismlarga bo‘linadi, ularni alohida surish mumkin. Kesik, yo‘l-yo‘l va «singan» harflar shunday qilinadi. Internet kerak.']],
['crop','✂',['Обрезка','Qirqish'],['«Обрезка» (Crop): обведите прямоугольник — всё, что за ним, отрезается. Так убирают лишние края у готовой композиции. Нужен интернет.','«Qirqish» (Crop): to‘rtburchak chizing — uning tashqarisidagi hamma narsa kesib tashlanadi. Tayyor kompozitsiyaning ortiqcha chetlari shunday olinadi. Internet kerak.']],
['attr','🖌',['Копия свойств','Xossa nusxasi'],['«Копия свойств» (Attributes Eyedropper): сначала коснитесь объекта-образца, потом объектов, которым нужны такие же заливка, контур, прозрачность и эффекты. Быстро делает всё «в одном стиле».','«Xossa nusxasi» (Attributes Eyedropper): avval namuna obyektga, keyin xuddi shunday to‘ldirish, kontur, shaffoflik va effekt kerak obyektlarga tegining. Hammasini «bir uslubda» tez qiladi.']],
['warp','🌊',['Деформация','Deformatsiya'],['«Деформация»: кисть, которая гнёт края фигуры (7 режимов во вкладке «🌊 Деформация»: Сгладить, Размазать, Закрутить, Притянуть, Оттолкнуть, Размыть, Шероховатость). Выберите фигуру и ведите пальцем у её края.','«Deformatsiya»: shakl chetlarini egadigan cho‘tka («🌊 Deformatsiya» bo‘limida 7 rejim: Silliqlash, Surish, Burish, Tortish, Itarish, Xiralash, Dag‘allik). Shaklni tanlab, barmoqni uning chetida yuriting.']],
['bsp','〰',['Плавная кривая (B-Spline)','Silliq egri (B-Spline)'],['«B-Spline»: просто ставьте точки касанием — линия сама плавно их огибает, без ручек. Двойное касание завершает. Для плавных контуров, которые не хочется настраивать.','«B-Spline»: shunchaki teginib nuqta qo‘ying — chiziq ularni o‘zi silliq aylanib o‘tadi, dastasiz. Ikki marta tegish tugatadi. Sozlashni istamagan silliq konturlar uchun.']],
['arc3','◠',['Кривая по 3 точкам','3 nuqtali egri'],['«Кривая по 3 точкам»: проведите линию от начала до конца — получится дуга. Изогнуть сильнее или слабее можно инструментом «Форма». Для дуг, арок, бровей, улыбок.','«3 nuqtali egri»: boshidan oxirigacha chiziq torting — yoy hosil bo‘ladi. «Shakl» bilan kuchliroq yoki kuchsizroq egish mumkin. Yoy, arka, qosh, tabassum uchun.']],
['smart','🪄',['Умный рисунок','Aqlli chizma'],['«Умный рисунок» (Smart Drawing): рисуйте от руки грубо — программа сама поймёт, что это круг, прямоугольник, треугольник или линия, и сделает ровную фигуру. Остальное сгладит в кривую.','«Aqlli chizma» (Smart Drawing): qo‘lda dag‘al chizing — dastur bu doira, to‘rtburchak, uchburchak yoki chiziq ekanini o‘zi tushunib, tekis shakl yasaydi. Qolganini egri chiziqqa silliqlaydi.']],
['calli','🖋',['Каллиграфия','Kalligrafiya'],['«Каллиграфия» (Artistic Media): перо с плоским кончиком — линия толще или тоньше в зависимости от направления, как у каллиграфа. Для подписей, открыток, надписей от руки.','«Kalligrafiya» (Artistic Media): tekis uchli qalam — chiziq yo‘nalishga qarab yo‘g‘on yoki ingichka bo‘ladi, xattotdagi kabi. Imzo, otkritka, qo‘lyozma uchun.']],
['spray','🎇',['Распылитель','Purkagich'],['«Распылитель» (Sprayer): ведите пальцем — вдоль линии «рассыпаются» маленькие звёздочки. Кнопка «Фигура» во вкладке «Aa Текст» меняет их на сердечки и точки. Для украшений и праздничных рамок.','«Purkagich» (Sprayer): barmoqni yuriting — chiziq bo‘ylab mayda yulduzchalar «sochiladi». «Aa Matn» bo‘limidagi «Shakl» tugmasi ularni yurak va nuqtalarga almashtiradi. Bezak va bayram ramkalari uchun.']],
['r3','▱',['3-точечный прямоугольник','3 nuqtali to‘rtburchak'],['«3-точечный прямоугольник»: проведите линию — получится прямоугольник, повёрнутый вдоль неё. Удобно, когда нужна сразу наклонная плашка или табличка.','«3 nuqtali to‘rtburchak»: chiziq torting — shu chiziq bo‘ylab burilgan to‘rtburchak hosil bo‘ladi. Qiyshiq planka yoki tablichka kerak bo‘lganda qulay.']],
['e3','⬭',['3-точечный эллипс','3 nuqtali ellips'],['«3-точечный эллипс»: проведите линию — получится эллипс, наклонённый вдоль неё. Для листьев, лепестков, наклонных овалов.','«3 nuqtali ellips»: chiziq torting — shu chiziq bo‘ylab qiyshaygan ellips hosil bo‘ladi. Barg, gulbarg, qiyshiq oval uchun.']],
['common','❖',['Готовые фигуры','Tayyor shakllar'],['«Готовые фигуры» (Common Shapes): при выборе открывается набор — молния, облако, выноска, капля, месяц, флаг, кольцо, ромб, галочка, плюс. Выберите и проведите по листу.','«Tayyor shakllar» (Common Shapes): tanlaganda to‘plam ochiladi — chaqmoq, bulut, izoh, tomchi, oy, bayroq, halqa, romb, belgi, plyus. Tanlab, varaq bo‘ylab torting.']],
['grid','▦',['Миллиметровка','Millimetrli to‘r'],['«Миллиметровка» (Graph Paper): проведите прямоугольник — внутри появится сетка из клеток. Для чертежей, разметки, шаблонов.','«Millimetrli to‘r» (Graph Paper): to‘rtburchak torting — ichida kataklar to‘ri paydo bo‘ladi. Chizma, belgilash, shablon uchun.']],
['table','☷',['Таблица','Jadval'],['«Таблица» (Table): проведите прямоугольник — получится таблица с закрашенной шапкой. Для прайсов, расписаний, меню.','«Jadval» (Table): to‘rtburchak torting — to‘ldirilgan sarlavhali jadval hosil bo‘ladi. Prays, jadval, menyu uchun.']],
['ptext','¶',['Абзацный текст','Abzats matni'],['«Абзацный текст» (Paragraph Text): проведите рамку и введите текст — он сам переносится по строкам. Размер рамки меняет перенос, «Aa Текст» — размер букв. Для статей и описаний.','«Abzats matni» (Paragraph Text): ramka torting va matn kiriting — u o‘zi qatorlarga bo‘linadi. Ramka o‘lchami bo‘linishni, «Aa Matn» harf o‘lchamini o‘zgartiradi. Maqola va tavsiflar uchun.']],
['dim','📏',['Размер','O‘lcham'],['«Размер» (Dimension): проведите линию от точки до точки — появится размерная линия со стрелками и длиной в миллиметрах (по выбранной странице). Для чертежей и макетов.','«O‘lcham» (Dimension): nuqtadan nuqtagacha chiziq torting — millimetrlarda uzunlikli strelkali o‘lcham chizig‘i paydo bo‘ladi (tanlangan sahifa bo‘yicha). Chizma va maketlar uchun.']],
['conn','⤳',['Соединитель','Ulagich'],['«Соединитель» (Connector): коснитесь первого объекта, затем второго — между ними появится линия-связь с изгибом. Если двигать объекты, линия следует за ними. Для схем и блок-схем.','«Ulagich» (Connector): avval birinchi, so‘ng ikkinchi obyektga tegining — ular orasida bukilgan bog‘lovchi chiziq paydo bo‘ladi. Obyektlar surilsa, chiziq ular ortidan boradi. Sxema va blok-sxemalar uchun.']],
['hand','✋',['Рука','Qo‘l'],['«Рука»: после увеличения 🔍＋ двигайте страницу пальцем, чтобы добраться до нужного места.','«Qo‘l»: 🔍＋ dan so‘ng sahifani barmoq bilan siljiting.']],
['ctext','Ⓐ',['Текст по кругу','Doira bo‘ylab matn'],['«Текст по кругу»: коснитесь центра будущей эмблемы и введите надпись — она ляжет по окружности. Размер и интервал букв меняются во вкладке «Aa Текст». Так делают круглые эмблемы и печати.','«Doira bo‘ylab matn»: kelajakdagi emblema markaziga tegib yozuv kiriting — u aylana bo‘ylab joylashadi. Harf o‘lchami va oralig‘i «Aa Matn» bo‘limida o‘zgaradi. Dumaloq emblema va muhrlar shunday qilinadi.']],
['text','T',['Текст','Matn'],['«Текст»: коснитесь страницы и введите надпись. Размер меняется угловым маркером.','«Matn»: sahifaga tegib yozuv kiriting. O‘lchami burchak markeri bilan o‘zgaradi.']],
['eye','💧',['Пипетка','Pipetka'],['«Пипетка»: коснитесь объекта — возьмёте его цвет. Он применится к выделенному объекту и к новым.','«Pipetka»: obyektga tegib rangini oling. U tanlangan va yangi obyektlarga qo‘llanadi.']]];

function curveD(s){const N=s.nodes,P=q=>(s.x+q[0]*s.w)+' '+(s.y+q[1]*s.h);let d='M'+P(N[0].p);for(let i=1;i<N.length;i++)d+='C'+P(N[i-1].b)+' '+P(N[i].a)+' '+P(N[i].p);if(s.closed&&N.length>1)d+='C'+P(N[N.length-1].b)+' '+P(N[0].a)+' '+P(N[0].p)+'Z';return d}
function absN(s){const q=u=>[s.x+u[0]*s.w,s.y+u[1]*s.h];return s.nodes.map(n=>({p:q(n.p),a:q(n.a),b:q(n.b),sm:n.sm}))}
function renorm(s,A){const xs=A.map(n=>n.p[0]),ys=A.map(n=>n.p[1]);s.x=Math.min(...xs);s.y=Math.min(...ys);s.w=Math.max(1,Math.max(...xs)-s.x);s.h=Math.max(1,Math.max(...ys)-s.y);const q=u=>[(u[0]-s.x)/s.w,(u[1]-s.y)/s.h];s.nodes=A.map(n=>({p:q(n.p),a:q(n.a),b:q(n.b),sm:n.sm}))}
function toCurve(s){const x=s.x,y=s.y,w=s.w,h=s.h,t=s.type,cr=q=>({p:q,a:[...q],b:[...q],sm:false});let A;
 if(t==='rect')A=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(cr);
 else if(t==='ell'){const k=.5523,rx=w/2,ry=h/2,cx=x+rx,cy=y+ry;A=[{p:[cx,y],a:[cx-k*rx,y],b:[cx+k*rx,y]},{p:[x+w,cy],a:[x+w,cy-k*ry],b:[x+w,cy+k*ry]},{p:[cx,y+h],a:[cx+k*rx,y+h],b:[cx-k*rx,y+h]},{p:[x,cy],a:[x,cy+k*ry],b:[x,cy-k*ry]}].map(n=>({...n,sm:true}))}
 else{const P=t==='poly'?polyPts(s):t==='tri'?[[.5,0],[1,1],[0,1]]:t==='arrow'?[[0,.35],[.6,.35],[.6,.1],[1,.5],[.6,.9],[.6,.65],[0,.65]]:star(s).split(' ').map(q=>{const r=q.split(',').map(Number);return[(r[0]-x)/w,(r[1]-y)/h]});A=P.map(q=>cr([x+q[0]*w,y+q[1]*h]))}
 s.type='curve';s.closed=true;renorm(s,A)}
function nodesUi(s,h){const A=absN(s);let x='';A.forEach((n,i)=>{if(i===NSI){x+=`<path d="M${n.a}L${n.p}L${n.b}" stroke="#2a7fff" fill="none" pointer-events="none"/>`;[['a',n.a],['b',n.b]].forEach(r=>x+=`<circle data-hn="${i}:${r[0]}" cx="${r[1][0]}" cy="${r[1][1]}" r="10" fill="#fff" stroke="#2a7fff" stroke-width="2"/>`)}x+=`<rect data-n="${i}" x="${n.p[0]-10}" y="${n.p[1]-10}" width="20" height="20" fill="${i===NSI?'#2a7fff':'#fff'}" stroke="#2a7fff" stroke-width="2"/>`});h.innerHTML+=x}
function nodeMove(d,p){const s=d.s,A=absN(s),n=A[d.i];if(d.m==='nd'){const dx=p.x-n.p[0],dy=p.y-n.p[1];n.p=[p.x,p.y];n.a=[n.a[0]+dx,n.a[1]+dy];n.b=[n.b[0]+dx,n.b[1]+dy];F.node=true}else{n[d.w]=[p.x,p.y];if(n.sm){const o=d.w==='a'?'b':'a';n[o]=[2*n.p[0]-p.x,2*n.p[1]-p.y]}F.hnd=true}renorm(s,A)}
function bzMove(d,p){const s=d.s,n=s.A[s.A.length-1];if(Math.hypot(p.x-n.p[0],p.y-n.p[1])>6){n.b=[p.x,p.y];n.a=[2*n.p[0]-p.x,2*n.p[1]-p.y];n.sm=true}renorm(s,s.A)}
function nodeOp(a){const c=obj(SEL);if(!c||c.type!=='curve'){toast(K.nob[LG]);return}const A=absN(c),i=NSI,M=(u,v)=>[(u[0]+v[0])/2,(u[1]+v[1])/2];if(a!=='ncl'&&(i<0||i>=A.length)){toast(K.pn[LG]);return}
 if(a==='nadd'){const j=(i+1)%A.length;if(j===0&&!c.closed){toast(K.pn[LG]);return}snap();const n0=A[i],n1=A[j],q0=M(n0.p,n0.b),q1=M(n0.b,n1.a),q2=M(n1.a,n1.p),r0=M(q0,q1),r1=M(q1,q2);n0.b=q0;n1.a=q2;A.splice(i+1,0,{p:M(r0,r1),a:r0,b:r1,sm:true});NSI=i+1;F.nadd=true}
 else if(a==='ndel'){if(A.length<=2)return;snap();A.splice(i,1);NSI=-1}
 else if(a==='nsm'){snap();const n=A[i];if(n.sm){n.a=[...n.p];n.b=[...n.p];n.sm=false}else{const pv=A[(i-1+A.length)%A.length].p,nx=A[(i+1)%A.length].p,k=1/6;n.a=[n.p[0]-(nx[0]-pv[0])*k,n.p[1]-(nx[1]-pv[1])*k];n.b=[n.p[0]+(nx[0]-pv[0])*k,n.p[1]+(nx[1]-pv[1])*k];n.sm=true}F.nsm=true}
 else if(a==='ncl'){snap();c.closed=!c.closed;F.ncl=true}
 renorm(c,A);draw();info()}
